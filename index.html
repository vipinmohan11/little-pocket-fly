<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kofferforscher</title><meta name="theme-color" content="#13324A"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<style>@font-face{font-family:'Big Shoulders Display';font-weight:800;src:url(fonts/big-shoulders-display-latin-800-normal.woff2) format('woff2');font-display:swap}
@font-face{font-family:'Big Shoulders Display';font-weight:900;src:url(fonts/big-shoulders-display-latin-900-normal.woff2) format('woff2');font-display:swap}
@font-face{font-family:'Figtree';font-weight:500;src:url(fonts/figtree-latin-500-normal.woff2) format('woff2');font-display:swap}
@font-face{font-family:'Figtree';font-weight:700;src:url(fonts/figtree-latin-700-normal.woff2) format('woff2');font-display:swap}
@font-face{font-family:'Figtree';font-weight:800;src:url(fonts/figtree-latin-800-normal.woff2) format('woff2');font-display:swap}
@font-face{font-family:'DM Mono';font-weight:500;src:url(fonts/dm-mono-latin-500-normal.woff2) format('woff2');font-display:swap}
@font-face{font-family:'Caveat';font-weight:700;src:url(fonts/caveat-latin-700-normal.woff2) format('woff2');font-display:swap}
:root{--ink:#13324A;--ink2:#55677A;--deep:#13324A;--ocean:#2779A7;--lagoon:#49C5B6;--sand:#ECD06F;--sky:#B5D5FF;--mint:#B1EAC4;--peach:#FFB288;--coral:#FF6A52;--cream:#F5F0E6;--paper:#FFFDF8;--ts:1;
--raise:0 1px 1px rgba(19,50,74,.1),0 10px 18px -12px rgba(19,50,74,.55),inset 0 1px 0 rgba(255,255,255,.7),inset 0 -3px 4px -1px rgba(0,0,0,.12);--card:0 18px 34px -24px rgba(19,50,74,.5)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:'Figtree',system-ui,sans-serif;color:var(--ink);background:radial-gradient(60% 70% at 0% 0%,rgba(73,197,182,.28),transparent 60%),radial-gradient(55% 70% at 100% 100%,rgba(236,208,111,.35),transparent 60%),radial-gradient(40% 50% at 100% 0%,rgba(39,121,167,.18),transparent 60%),var(--cream);overflow-x:hidden;font-size:calc(16px*var(--ts));line-height:1.45;-webkit-user-select:none;user-select:none}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
input,select,textarea{font-family:inherit;color:var(--ink);-webkit-user-select:text;user-select:text}
a{color:inherit;text-decoration:none}
h1,h2,h3,p{margin:0}
.mono{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2)}
.disp{font-family:'Big Shoulders Display',sans-serif;font-weight:900;line-height:.95;letter-spacing:.005em;text-transform:uppercase}
.hand{font-family:'Caveat',cursive;font-weight:700}
#app{min-height:100%;max-width:1280px;margin:0 auto;padding:0 20px 40px;position:relative}
.view{animation:vin .35s ease both}
@keyframes vin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.top{display:flex;align-items:center;gap:14px;padding:18px 0 14px;position:sticky;top:0;z-index:20;background:linear-gradient(var(--cream) 60%,rgba(245,240,230,0))}
.top h1{font-size:clamp(30px,4.4vw,46px)}
.top .sp{flex:1}
.back{width:52px;height:52px;border-radius:50%;background:var(--paper);display:grid;place-items:center;box-shadow:var(--raise);flex:none}
.back svg{width:22px;height:22px}
.pill{height:50px;border-radius:25px;padding:0 20px 0 6px;background:var(--deep);color:#fff;display:inline-flex;align-items:center;gap:10px;font-size:15px;font-weight:800;box-shadow:var(--raise)}
.pill.l{background:var(--paper);color:var(--ink)}
.pill i{width:38px;height:38px;border-radius:50%;background:var(--sand);display:grid;place-items:center;flex:none}
.pill i svg{width:18px;height:18px}
.pill.plain{padding:0 20px}
.chip{height:44px;border-radius:22px;padding:0 18px;background:var(--paper);box-shadow:var(--raise);font-weight:800;font-size:15px;white-space:nowrap}
.chip.on{background:var(--deep);color:#fff;box-shadow:inset 0 2px 6px rgba(0,0,0,.35)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.card{background:var(--paper);border-radius:26px;box-shadow:var(--card);padding:20px 22px}
.dark{background:linear-gradient(155deg,#16405E,#13324A 60%,#0F2A3F);color:#fff;border-radius:26px;padding:20px 22px;position:relative}
.dark .mono{color:var(--mint)}
.tab{position:absolute;left:22px;top:-14px;background:var(--sand);color:var(--ink);font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.14em;padding:5px 14px;border-radius:12px 12px 0 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.row{display:flex;align-items:center;gap:12px}
.col{display:flex;flex-direction:column;gap:12px}
.wrap{display:flex;flex-wrap:wrap;gap:10px}
.sp{flex:1}
.big{font-size:clamp(34px,5vw,60px)}
.muted{color:var(--ink2)}
.btn{height:50px;border-radius:25px;padding:0 24px;background:var(--lagoon);color:var(--ink);font-weight:800;font-size:16px;box-shadow:var(--raise)}
.btn.d{background:var(--deep);color:#fff}
.btn.s{background:var(--sand)}
.btn.c{background:var(--coral);color:#fff}
.btn.g{background:var(--paper)}
.btn[disabled]{opacity:.45}
.round{width:44px;height:44px;border-radius:50%;background:var(--paper);box-shadow:var(--raise);font-size:22px;font-weight:800;display:grid;place-items:center}
.bar{height:10px;border-radius:5px;background:rgba(19,50,74,.12);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--lagoon);border-radius:5px;transition:width .4s}
details.acc{background:var(--paper);border-radius:20px;box-shadow:var(--card);overflow:hidden}
details.acc>summary{list-style:none;cursor:pointer;padding:16px 20px;font-weight:800;font-size:17px;display:flex;align-items:center;gap:12px}
details.acc>summary::-webkit-details-marker{display:none}
details.acc>summary::after{content:'+';margin-left:auto;font-size:24px;line-height:1;color:var(--ocean)}
details.acc[open]>summary::after{content:'–'}
details.acc .c{padding:0 20px 18px}
.c ul,.c ol{margin:6px 0;padding-left:20px}.c li{margin:5px 0}
.tag{display:inline-block;font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.1em;padding:3px 9px;border-radius:10px;background:var(--sky);color:var(--ink);text-transform:uppercase}
.sheet{position:fixed;inset:0;background:rgba(19,50,74,.55);z-index:60;display:grid;place-items:center;padding:20px;animation:vin .2s}
.sheet>div{background:var(--paper);border-radius:28px;max-width:560px;width:100%;max-height:88vh;overflow:auto;padding:24px;box-shadow:0 30px 60px -20px rgba(0,0,0,.5)}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--deep);color:#fff;border-radius:22px;padding:12px 22px;font-weight:700;z-index:80;animation:vin .25s}
/* windows */
.windows{display:grid;grid-template-columns:repeat(7,1fr);gap:clamp(8px,1.4vw,18px);padding:8px 0 4px}
@media (max-width:820px){.windows{grid-template-columns:repeat(4,1fr)}}
.win{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;transition:transform .2s}
.win:active{transform:scale(.97)}
.bezel{position:relative;width:100%;aspect-ratio:.72;border-radius:46% / 33%;background:linear-gradient(160deg,#fff 0%,#E9ECEE 45%,#CBD1D5 100%);box-shadow:0 22px 28px -18px rgba(19,50,74,.65),inset 0 2px 2px #fff,inset 0 -6px 10px rgba(0,0,0,.12);padding:7%;transition:transform .9s cubic-bezier(.6,0,.2,1),opacity .5s}
.bezel::before{content:'';position:absolute;inset:3.5%;border-radius:inherit;border:2px solid rgba(255,255,255,.9);box-shadow:inset 0 0 0 2px rgba(0,0,0,.06)}
.glass{position:relative;width:100%;height:100%;border-radius:44% / 31%;overflow:hidden;box-shadow:inset 0 0 0 5px #7C8890,inset 0 10px 18px rgba(0,0,0,.35);background-image:url(assets/pano.svg);background-repeat:no-repeat;background-size:auto 330%;background-position:calc(var(--i)*16.66%) 41%}
.glass::after{content:'';position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,.28),transparent 35%);pointer-events:none}
.shade{position:absolute;left:0;right:0;top:0;height:var(--sh,30%);background:repeating-linear-gradient(180deg,#F4F5F5 0 9px,#DDE1E3 9px 11px);border-bottom:5px solid #B8BEC2;border-radius:0 0 8px 8px;transition:height .8s cubic-bezier(.5,0,.2,1);z-index:2;box-shadow:0 8px 12px -6px rgba(0,0,0,.3)}
.shade::after{content:'';position:absolute;left:50%;bottom:-14px;width:34px;height:10px;margin-left:-17px;border-radius:5px;background:#9AA3A8}
.win .ic{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;position:absolute;left:50%;bottom:14%;transform:translateX(-50%);z-index:3;box-shadow:var(--raise)}
.win .ic svg{width:18px;height:18px}
.win .lb{font-weight:800;font-size:clamp(12px,1.35vw,16px);line-height:1.15}
.win .st{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.08em;color:var(--ink2);text-transform:uppercase}
.win.paused .bezel{filter:saturate(.7)}
.zoomer{position:fixed;inset:0;z-index:90;background:var(--cream);opacity:0;pointer-events:none;transition:opacity .35s}
.zoomer.on{opacity:1}
/* generic tiles */
.tile{border-radius:26px;padding:18px 20px;box-shadow:var(--card);text-align:left;display:flex;flex-direction:column;gap:6px;min-height:120px;transition:transform .15s}
.tile:active{transform:scale(.98)}
.tile h3{font-size:22px}
/* packing album */
.album{display:grid;grid-template-columns:230px 1fr;gap:16px}
@media (max-width:820px){.album{grid-template-columns:1fr}}
.tabs{display:flex;flex-direction:column;gap:6px}
@media (max-width:820px){.tabs{flex-direction:row;overflow:auto}}
.ctab{padding:12px 16px;border-radius:16px 8px 8px 16px;background:rgba(255,253,248,.6);font-weight:800;display:flex;justify-content:space-between;gap:10px;white-space:nowrap;text-align:left}
.ctab.on{background:var(--paper);box-shadow:var(--raise);border-left:6px solid var(--c)}
.ctab small{font-family:'DM Mono',monospace;font-size:11px;color:var(--ink2)}
.item{display:flex;align-items:center;gap:14px;padding:12px 6px;border-top:1px solid rgba(19,50,74,.08);min-height:60px;width:100%;text-align:left}
.item .bx{width:32px;height:32px;border-radius:10px;border:2.5px solid var(--ink);flex:none;display:grid;place-items:center;background:#fff}
.item.done .bx{background:var(--lagoon);border-color:var(--lagoon)}
.item.done .tx{text-decoration:line-through;color:var(--ink2)}
.item .tx{font-weight:700;font-size:17px;flex:1}
.item .tx small{display:block;font-weight:500;font-size:13px;color:var(--ink2)}
.who{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.08em;padding:3px 8px;border-radius:9px;background:var(--sky);text-transform:uppercase}
.paper{background:var(--paper);border-radius:28px;box-shadow:var(--card);padding:18px 24px;background-image:repeating-linear-gradient(180deg,transparent 0 39px,#EEE6D3 39px 40px)}
/* wissen */
.chap{display:flex;gap:14px;align-items:center;padding:16px;border-radius:24px;background:var(--paper);box-shadow:var(--card);text-align:left;width:100%}
.chap .nm{width:54px;height:54px;border-radius:18px;display:grid;place-items:center;font-size:28px;flex:none}
.fact{border-left:5px solid var(--c,var(--lagoon));padding:8px 14px;background:rgba(255,255,255,.6);border-radius:0 14px 14px 0}
.opt{display:block;width:100%;text-align:left;padding:14px 18px;border-radius:18px;background:var(--paper);box-shadow:var(--raise);font-weight:700;margin:8px 0}
.opt.ok{background:var(--mint)}.opt.no{background:#FFD5CC}
input[type=range]{width:100%;accent-color:var(--ocean);height:34px}
.pin{display:grid;grid-template-columns:repeat(3,76px);gap:12px;justify-content:center}
.pin button{height:68px;border-radius:22px;background:var(--paper);box-shadow:var(--raise);font-size:26px;font-weight:800}
.dots{display:flex;gap:12px;justify-content:center;margin:14px 0}
.dots i{width:16px;height:16px;border-radius:50%;border:2.5px solid var(--ink)}
.dots i.f{background:var(--ink)}
.tgl{width:64px;height:36px;border-radius:18px;background:#C9CDD1;position:relative;transition:background .2s;flex:none}
.tgl::after{content:'';position:absolute;top:4px;left:4px;width:28px;height:28px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:left .2s}
.tgl.on{background:#2BA594}.tgl.on::after{left:32px}
.inp{height:50px;border-radius:16px;border:2px solid rgba(19,50,74,.18);padding:0 16px;font-size:17px;background:#fff;width:100%}
.stop{display:flex;gap:14px;padding:14px 0;border-top:1px solid rgba(19,50,74,.08)}
.stop .no{width:38px;height:38px;border-radius:50%;background:var(--deep);color:#fff;display:grid;place-items:center;font-weight:800;flex:none}
.stop.done .no{background:var(--lagoon);color:var(--ink)}
.leg{margin:2px 0 2px 52px;font-family:'DM Mono',monospace;font-size:12px;color:var(--ocean)}
.kid{background:var(--sand);border-radius:14px;padding:8px 12px;margin-top:8px;font-weight:700}
.sw{height:12px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.hide{display:none!important}
@keyframes dash{to{stroke-dashoffset:-64}}
.str{stroke-dashoffset:0}
@media print{.top,.chips,.back,.pill{display:none!important}body{background:#fff}}
.bezel,.glass,.shade{display:block}

var WISSEN=[
{id:'auftrieb',t:'Auftrieb',c:'#B5D5FF',sim:'lift',intro:'Ein Flugzeug mit 70 Tonnen schwebt in der Luft. Wie geht das? Die Antwort steckt in den Flügeln und in der Luft, die du nicht siehst.',
 secs:[
 ['Luft ist nicht „nichts“','Ein Würfel Luft von einem Meter Kantenlänge wiegt am Boden rund 1,2 Kilogramm. Wenn ein Flügel mit hoher Geschwindigkeit durch diese Luft saust, trifft er auf Milliarden winziger Teilchen. Genug, um ein ganzes Flugzeug zu tragen.'],
 ['Der Flügel lenkt Luft nach unten','Ein Flügel ist leicht schräg zur Strömung gestellt. Er schiebt die Luft nach unten. Die Luft schiebt den Flügel nach oben zurück. Das ist die Kraft, die wir Auftrieb nennen. Den Winkel zwischen Flügel und Luftstrom nennt man Anstellwinkel.'],
 ['Gewölbt oben, flacher unten','Die Oberseite eines Flügels ist gewölbt. Die Luft folgt der Wölbung und wird so zusätzlich nach unten gelenkt. Auf der gewölbten Seite sinkt der Druck ein wenig. Unterdruck oben und Überdruck unten ziehen und schieben den Flügel zusammen nach oben.'],
 ['Schneller heißt mehr Auftrieb','Verdoppelst du die Geschwindigkeit, wird der Auftrieb viermal so groß. Darum rollt ein Flugzeug erst über die Bahn: Es braucht Tempo, bis die Flügel genug tragen. Das ist der Startlauf.'],
 ['Klappen zum langsam Fliegen','Beim Start und bei der Landung fährt das Flugzeug Klappen an der Flügelhinterkante und Vorflügel an der Vorderkante aus. Sie machen den Flügel größer und gewölbter. So trägt er auch bei geringerem Tempo. Von deinem Fenstersitz aus kannst du ihnen beim Ausfahren zusehen.']],
 facts:['Ein Airbus A320 hat eine Spannweite von etwa 36 Metern, das ist breiter als ein Basketballfeld lang ist.','Auch ein Vogel nutzt Auftrieb: Er breitet die Flügel aus und lässt sich von warmer Luft nach oben tragen.','Der Papierflieger fliegt nach demselben Prinzip wie ein Jumbo. Nur der Motor ist deine Wurfhand.','Die Brüder Wright flogen 1903 zum ersten Mal mit einem Motorflugzeug. Der erste Flug dauerte 12 Sekunden.','Segelflieger steigen nur mit Aufwind und fliegen so viele Stunden ohne Motor.'],
 quiz:[['Was macht ein Flügel mit der Luft?',['Er schiebt sie nach unten','Er saugt sie in sich hinein','Er hält sie fest'],0,'Der Flügel lenkt die Luft nach unten, die Gegenkraft hebt ihn nach oben.'],['Was passiert mit dem Auftrieb, wenn das Flugzeug doppelt so schnell fliegt?',['Er bleibt gleich','Er wird viermal so groß','Er halbiert sich'],1,'Der Auftrieb wächst mit dem Quadrat der Geschwindigkeit.'],['Wozu sind die Klappen am Flügel da?',['Zum Bremsen am Boden','Damit der Flügel auch bei langsamem Tempo trägt','Zum Kühlen'],1,'Klappen vergrößern und wölben den Flügel für Start und Landung.']]},

{id:'kraefte',t:'Die vier Kräfte',c:'#ECD06F',sim:'forces',intro:'Jedes Flugzeug wird von vier Kräften gleichzeitig gehalten, gezogen und geschoben. Pilotinnen und Piloten spielen mit ihnen wie bei einem Tauziehen, das immer im Gleichgewicht bleibt.',
 secs:[
 ['Auftrieb – nach oben','Er entsteht an den Flügeln und hebt das Flugzeug an.'],
 ['Gewicht – nach unten','Das Flugzeug samt Passagieren, Gepäck und Treibstoff wird von der Erde angezogen. Je leichter, desto weniger Auftrieb braucht es. Darum zählt beim Check-in jedes Kilo.'],
 ['Schub – nach vorne','Die Triebwerke blasen Luft nach hinten und schieben das Flugzeug dadurch nach vorne.'],
 ['Widerstand – nach hinten','Die Luft bremst alles, was sich durch sie bewegt. Darum haben Flugzeuge eine glatte, stromlinienförmige Form. Am Ende der Flügel stehen oft kleine aufgebogene Spitzen, sogenannte Winglets. Sie verringern den Widerstand und sparen Treibstoff.'],
 ['Gleichgewicht im Reiseflug','Im Reiseflug sind Auftrieb und Gewicht gleich groß und Schub und Widerstand ebenfalls. Dann fliegt das Flugzeug geradeaus, ohne zu steigen oder zu sinken. Beim Steigen ist der Auftrieb etwas größer, beim Sinken etwas kleiner.']],
 facts:['Beim Abheben ist der Schub fast am größten. Im Reiseflug reicht weniger.','Der Treibstoff steckt zum großen Teil in den Flügeln. Er macht sie schwer und hält sie zugleich ruhig.','Ein Flugzeug wird während des Fluges leichter, weil es Treibstoff verbraucht.','Gleitflug: Auch ganz ohne Schub gleitet ein Flugzeug weit, ähnlich wie ein Papierflieger.'],
 quiz:[['Welche Kraft schiebt das Flugzeug nach vorne?',['Gewicht','Schub','Widerstand'],1,'Die Triebwerke erzeugen den Schub.'],['Wann sind alle vier Kräfte im Gleichgewicht?',['Im Geradeausflug in gleicher Höhe','Beim Start','Beim Parken'],0,'Im Reiseflug halten sich Auftrieb/Gewicht und Schub/Widerstand die Waage.'],['Wofür sind Winglets gut?',['Als Antenne','Sie verringern den Widerstand','Sie machen den Flieger bunter'],1,'Winglets sparen Treibstoff.']]},

{id:'steuern',t:'Steuern',c:'#49C5B6',sim:'steer',intro:'Ein Flugzeug kann sich auf drei Arten drehen. Für jede gibt es ein eigenes Ruder. Du kannst sie beim Warten am Flughafen oder im Flug am Fenster beobachten.',
 secs:[
 ['Rollen – Querruder','Die Querruder sitzen hinten außen an den Flügeln. Geht das eine nach oben und das andere nach unten, neigt sich das Flugzeug zur Seite. So fliegt es Kurven.'],
 ['Nicken – Höhenruder','Das Höhenruder sitzt hinten am waagerechten Leitwerk. Nach oben gestellt hebt es die Nase, nach unten senkt es sie. So steigt und sinkt das Flugzeug.'],
 ['Gieren – Seitenruder','Das Seitenruder steht am senkrechten Leitwerk, der großen Flosse hinten. Es dreht die Nase nach links oder rechts. Es hält das Flugzeug sauber in der Spur, vor allem bei Wind.'],
 ['Spoiler und Klappen','Auf den Flügeln stehen zusätzliche Platten, die Spoiler. Sie klappen nach der Landung hoch und nehmen dem Flügel den Auftrieb, damit das Flugzeug fest auf der Bahn steht und bremsen kann.'],
 ['Trimmung','Kleine Einstellungen am Leitwerk halten das Flugzeug im Reiseflug ruhig, ohne dass jemand ständig steuern muss. Der Autopilot hilft dabei.']],
 facts:['Die Steuerung im Cockpit geht heute über Kabel und Computer („Fly-by-wire“), nicht mehr nur über Seile und Stangen.','Ein Seitensteuer-Pedal wird mit den Füßen bewegt, das Höhen- und Querruder mit dem Steuerknüppel.','Bei der Landung siehst du die Spoiler als Platten auf den Flügeln, wenn du am Fenster sitzt.'],
 quiz:[['Welches Ruder lässt das Flugzeug steigen?',['Seitenruder','Höhenruder','Querruder'],1,'Das Höhenruder hebt oder senkt die Nase.'],['Wozu sind Spoiler nach der Landung da?',['Sie nehmen dem Flügel den Auftrieb','Sie sind Lichter','Sie kühlen die Reifen'],0,'Damit das Flugzeug fest auf der Bahn steht und bremsen kann.'],['Was bewirkt das Seitenruder?',['Es dreht die Nase nach links oder rechts','Es fährt das Fahrwerk aus','Es heizt die Kabine'],0,'Es steuert das Gieren.']]},

{id:'triebwerk',t:'Triebwerke',c:'#FF6A52',sim:'engine',intro:'Ein modernes Triebwerk ist wie ein riesiger, sehr kontrollierter Föhn: Es saugt Luft an, drückt sie zusammen, mischt Treibstoff dazu und bläst sie kraftvoll nach hinten.',
 secs:[
 ['1 · Ansaugen','Ganz vorn dreht sich der Fan, ein großes Rad mit breiten Schaufeln. Es saugt Luft an. Der größte Teil der Luft läuft außen am Kern vorbei und liefert den Großteil des Schubs.'],
 ['2 · Verdichten','Im Kern drücken viele kleine Schaufelräder die Luft auf einen Bruchteil ihres Raumes zusammen. Dabei wird sie heiß und steht unter hohem Druck.'],
 ['3 · Verbrennen','In der Brennkammer spritzt Treibstoff in die verdichtete Luft. Die Mischung brennt gleichmäßig. Die Gase dehnen sich mit großer Kraft aus.'],
 ['4 · Antreiben und Ausstoßen','Die heißen Gase treiben eine Turbine an, ähnlich wie Wind eine Windmühle. Die Turbine dreht den Fan und den Verdichter vorne mit. Der Rest strömt nach hinten hinaus und schiebt das Flugzeug.'],
 ['Leiser und sparsamer','Neue Triebwerke haben größere Fans und lassen mehr Luft außen vorbeiströmen. Das spart Treibstoff und macht sie leiser.']],
 facts:['Der Fan eines großen Triebwerks hat mehr als drei Meter Durchmesser.','Die Schaufeln drehen sich tausende Male pro Minute.','Triebwerke werden im Test sogar mit Wasser und Sand beschossen, damit sie robust sind.','Moderne Flugzeuge können auch mit teilweise nachhaltigem Treibstoff fliegen.'],
 quiz:[['Was macht der Fan?',['Er saugt Luft an','Er kühlt den Treibstoff','Er dreht den Reifen'],0,'Der Fan zieht Luft ins Triebwerk.'],['Was treibt die Turbine an?',['Die heißen Gase','Die Passagiere','Ein Gummiband'],0,'Die Gase strömen durch die Turbine wie Wind durch eine Windmühle.'],['Wo wird der Treibstoff verbrannt?',['In der Brennkammer','Im Fan','In den Rädern'],0,'In der Brennkammer mischt sich Treibstoff mit der verdichteten Luft.']]},

{id:'innen',t:'Im Inneren',c:'#B1EAC4',sim:'inside',intro:'Ein Flugzeug ist wie ein kleines Dorf, das fliegt: Cockpit, Küche, Gepäckkeller, Wohnzimmer – und alles passt in eine Röhre.',
 secs:[
 ['Cockpit','Hier arbeiten Kapitänin oder Kapitän und Erste Offiziere zusammen. Sie prüfen vor jedem Flug Wetter, Route, Treibstoff und Technik. Viele Anzeigen sind Bildschirme.'],
 ['Kabine','Die Kabine ist luftdicht. Die Luft wird gefiltert und auf einen angenehmen Druck gebracht, ungefähr wie auf einem Berg in 2 000 Metern Höhe. Deshalb knackt es manchmal in den Ohren.'],
 ['Frachtraum','Unter dem Boden der Kabine liegen Koffer und Fracht. Auch dieser Raum ist beheizt und belüftet.'],
 ['Tanks','Der Treibstoff liegt vor allem in den Flügeln. Dort ist viel Platz, und das Gewicht ist gut verteilt.'],
 ['Fahrwerk','Beim Start fährt das Fahrwerk ein, damit weniger Widerstand entsteht. Du hörst dabei ein leises Rumpeln. Vor der Landung fährt es wieder aus.'],
 ['Küche und Toiletten','Die Bordküche (Galley) hat Wagen, Öfen und Kaffeemaschinen. Das Wasser kommt aus Tanks.']],
 facts:['Fenster haben ein winziges Loch, das Druck ausgleicht und Beschlag verhindert.','Die Kabinendecke und Sitze sind so gebaut, dass sie bei jedem Flug sehr leicht sind.','Das Licht in der Kabine wird beim Start und bei der Landung gedimmt, damit sich die Augen schneller an Dunkelheit gewöhnen.','Das Bordmenü wird auf der Erde vorbereitet und an Bord aufgewärmt.'],

{id:'start',t:'Start und Landung',c:'#FFB288',sim:'phases',intro:'Ein Flug besteht aus mehreren Abschnitten, wie die Kapitel in einem Buch. Wenn du sie kennst, weißt du immer, was gerade passiert.',
 secs:[
 ['Rollen','Das Flugzeug rollt zur Startbahn. Du hörst leise Geräusche vom Fahrwerk und spürst kleine Kurven.'],
 ['Startlauf','Die Triebwerke geben mehr Schub, das Flugzeug beschleunigt. Du wirst sanft in den Sitz gedrückt.'],
 ['Abheben','Bei etwa 250 bis 280 km/h hebt die Nase ab und die Räder verlassen den Boden.'],
 ['Steigflug','Das Flugzeug steigt in Kurven und gerade aus, bis es seine Reiseflughöhe erreicht. Das Fahrwerk fährt ein. Die Klappen werden eingezogen.'],
 ['Reiseflug','In etwa 10 bis 12 Kilometern Höhe fliegt es bei rund 850 km/h. Hier ist die Luft dünn und kalt, aber sehr ruhig.'],
 ['Sinkflug und Anflug','Das Flugzeug sinkt langsam, die Klappen kommen heraus, das Fahrwerk fährt aus. Die Landebahn wird größer.'],
 ['Landung','Die Räder berühren die Bahn bei etwa 250 km/h. Spoiler und Bremsen bringen das Flugzeug zum Stehen. Dann rollst du zum Gate.']],
 facts:['Die Landebahn in Barcelona liegt direkt am Meer. Bei klarem Wetter siehst du beim Anflug die Küste.','Beim Start geht es sehr schnell: In etwa 30 Sekunden vom Stehen zum Abheben.','Piloten sprechen bei der Landung vom „Aufsetzen“. Gute Landungen sind oft ganz sanft.','Die Reiseflughöhe wird so gewählt, dass das Flugzeug möglichst wenig Treibstoff braucht.'],

{id:'wetter',t:'Wolken und Wetter',c:'#9ACDEB',sim:'weather',intro:'Über den Wolken ist es fast immer sonnig. Von oben siehst du, wie Wetter „gemacht“ wird.',
 secs:[
 ['Wolkenfamilien','Cumulus sind die weißen Haufenwolken. Stratus ist eine flache Schicht, oft grau. Cirrus sind hohe, dünne Schleier aus Eiskristallen. Cumulonimbus sind die hohen Gewitterwolken, die wie Türme aussehen. Flugzeuge fliegen um sie herum.'],
 ['Warum wird es oben kalt?','Pro 1 000 Meter Höhe sinkt die Temperatur im Mittel um etwa 6,5 Grad. In Reiseflughöhe sind es ungefähr minus 55 Grad. Außen kalt, innen gemütlich: Die Kabine wird beheizt.'],
 ['Schaukeln in der Luft','Manchmal schaukelt das Flugzeug leicht. Das sind Luftströmungen, wie Wellen auf dem Wasser. Das Flugzeug ist dafür gebaut. Man bleibt am besten angeschnallt.'],
 ['Kondensstreifen','Die weißen Streifen hinter dem Flugzeug entstehen, wenn heißer, feuchter Abgasstrahl in der sehr kalten Luft zu winzigen Eiskristallen gefriert.'],
 ['Besondere Himmelsbilder','Manchmal sieht man vom Flugzeug einen runden Regenbogen, der den Schatten des Flugzeugs umgibt. Er heißt Glorie. Du brauchst Sonne in deinem Rücken und eine Wolkenschicht unten.']],
 facts:['Eine kleine Sommerwolke kann mehrere hundert Tonnen Wasser enthalten.','Wolken schweben, weil die Wassertröpfchen so klein sind.','Auch Vögel nutzen Wetter: Zugvögel fliegen mit Rückenwind.','Der höchste Berg der Erde, der Mount Everest, ist 8 849 Meter hoch, also niedriger als ein Flugzeug fliegt.'],
 quiz:[['Wie kalt ist es in Reiseflughöhe etwa?',['+15 Grad','0 Grad','etwa minus 55 Grad'],2,'Mit der Höhe sinkt die Temperatur.'],['Welche Wolke ist die Gewitterwolke?',['Cirrus','Cumulonimbus','Stratus'],1,'Cumulonimbus ist die hohe Türme-Wolke.'],['Wie entsteht ein Kondensstreifen?',['Aus Eiskristallen im kalten Abgas','Aus Rauch','Aus Schnee'],0,'Der feuchte Abgasstrahl gefriert in der Kälte.']]},

{id:'wege',t:'Wege am Himmel',c:'#2779A7',sim:'routes',intro:'Auch am Himmel gibt es Straßen, Schilder und Verkehrsregeln. Sie sind nur unsichtbar. Genau dadurch kommen viele Flugzeuge sicher und pünktlich an.',
 secs:[
 ['Der kürzeste Weg ist gebogen','Die Erde ist rund. Der kürzeste Weg zwischen zwei Orten ist ein Bogen, der „Großkreis“. Auf einer flachen Karte sieht er manchmal gebogen aus, auf dem Globus ist er die gerade Linie.'],
 ['Flugstraßen','Flugzeuge folgen festgelegten Strecken, die aus Punkten mit fünf Buchstaben bestehen. Das ist wie ein Netz aus Autobahnen mit Kreuzungen.'],
 ['Flugsicherung','Lotsen am Boden sprechen mit den Pilotinnen und Piloten. Sie sorgen für ausreichenden Abstand und die richtige Reihenfolge beim Landen. Die Sprache dabei ist Englisch.'],
 ['Jetstream','In großer Höhe weht ein sehr starker Wind von West nach Ost. Flüge nach Osten sind dadurch oft kürzer, Flüge nach Westen etwas länger.'],
 ['Navigation','Heute helfen Satelliten (GPS) und Funkfeuer. Aber auch ein Kompass gehört weiter zur Ausstattung.'],
 ['Hannover → Barcelona','Die Luftlinie von Hannover nach Barcelona beträgt rund 1 370 Kilometer. Die Richtung ist Südwest. Du überfliegst unterwegs Deutschland, einen Zipfel Frankreich und die Pyrenäen, bevor das Mittelmeer auftaucht.']],

 {id:"rambla",n:"La Rambla",lat:41.3845,lng:2.1712,k:"see",t:"10:00",c:"Free",why:"The famous promenade. Walk it once, downhill, and keep going.",kid:"Find Joan Miró's colourful mosaic set into the pavement.",tip:"Busiest pickpocket zone in the city. Bags zipped and in front. Don't eat here."},
 {id:"boq",n:"La Boqueria market",lat:41.3818,lng:2.1716,k:"eat",t:"10:20",c:"Fruit cups & juice ~€2–4",why:"Covered market with fruit pyramids, jamón and sweets.",kid:"Pick a fresh juice colour each.",tip:"Stalls deeper inside are cheaper than at the entrance. Open Mon–Sat."},
 {id:"reial",n:"Plaça Reial",lat:41.3801,lng:2.1754,k:"see",t:"11:00",c:"Free",why:"Palm-tree square with arcades.",kid:"The lampposts were Gaudí's very first job for the city.",tip:"Toilets: use a café you buy something in."},
 {id:"pallaresa",n:"Granja La Pallaresa (churros)",lat:41.3830,lng:2.1733,k:"eat",t:"11:30",c:"~€15 for three",why:"Thick hot chocolate and churros on Carrer de Petritxol since 1947.",kid:"Dip the churro, don't drink the chocolate. It's that thick.",tip:"Share one portion of churros between two."},
 {id:"cath",n:"Barcelona Cathedral",lat:41.3840,lng:2.1762,k:"see",t:"12:00",c:"Square free · inside paid",why:"Gothic cathedral with a huge front square.",kid:"13 white geese live in the cloister, one for each year of young Saint Eulàlia's life.",tip:"Shoulders and knees covered to enter."},
 {id:"felip",n:"Plaça de Sant Felip Neri",lat:41.3833,lng:2.1749,k:"see",t:"12:20",c:"Free",why:"A tiny, quiet square with a sad story.",kid:"The holes in the church wall come from a 1938 bombing.",tip:"Speak softly; there's a school here."},
 {id:"bisbe",n:"Pont del Bisbe",lat:41.3830,lng:2.1767,k:"see",t:"12:30",c:"Free",why:"The lacy stone bridge everyone photographs.",kid:"Legend says a skull with a dagger is hidden under the bridge. Can you find it?",tip:"Stand on Carrer del Bisbe for the classic shot."},
 {id:"conesa",n:"Conesa Entrepans (lunch)",lat:41.3829,lng:2.1775,k:"eat",t:"13:00",c:"~€5 per sandwich",why:"Toasted sandwiches since 1951 with 90+ fillings, on Plaça Sant Jaume.",kid:"Ham-and-cheese toastie is a safe pick.",tip:"Order at the counter, eat on the square."},
 {id:"august",n:"Temple d'August",lat:41.3836,lng:2.1774,k:"see",t:"13:45",c:"Free",why:"Four 2,000-year-old Roman columns hidden inside a courtyard.",kid:"These columns are older than the city's name. It was called Barcino.",tip:"Small site; may have short opening hours. Peek in if open."},
 {id:"rei",n:"Plaça del Rei",lat:41.3841,lng:2.1777,k:"see",t:"14:00",c:"Free",why:"The medieval royal square. Under it lie Roman streets (MUHBA museum).",kid:"Pretend you're arriving at the king's palace up the stone steps.",tip:"MUHBA museum is a good rainy option."},
 {id:"smm",n:"Santa Maria del Mar",lat:41.3838,lng:2.1820,k:"see",t:"14:30",c:"Exterior free · inside small fee",why:"The 'cathedral of the sea', built by port workers who carried the stones.",kid:"Look for the carved porters with stones on their backs on the doors.",tip:"Sit on the steps for a break."},
 {id:"bornccm",n:"El Born CCM",lat:41.3855,lng:2.1838,k:"see",t:"15:00",c:"Free entry to the ruins view",why:"An old iron market built over the streets of 1714 Barcelona. You look down on them.",kid:"Find the old houses' doorways down in the dig.",tip:"Closed Mondays, which is why the old town is on Tuesday."},
 {id:"pizza",n:"La Pizza del Born (dinner)",lat:41.3850,lng:2.1830,k:"eat",t:"evening",c:"~€6 two slices + drink",why:"Pizza by the slice on Passeig del Born. Cheap and quick.",kid:"Easy dinner for a tired walker.",tip:"Dinner in Spain starts late; slice shops suit families."}],
 extras:[
 {id:"x-palau",n:"Palau de la Música Catalana",lat:41.3876,lng:2.1753,k:"see",cat:"Hidden gem",c:"Exterior free · tours paid",why:"Concert hall with mosaic columns and flower tiles on the outside.",kid:"Find the mosaic pillars and the stone singers on the corner.",tip:"5 min from the cathedral."},
 {id:"x-caterina",n:"Mercat de Santa Caterina",lat:41.3863,lng:2.1786,k:"see",cat:"Hidden gem",c:"Free",why:"Market with a wavy roof of over 300,000 tiles in fruit-and-vegetable colours.",kid:"From the side street, the roof looks like a wave of fruit.",tip:"Calmer and cheaper than La Boqueria."},
 {id:"x-berenguer",n:"Roman walls, Plaça de Ramon Berenguer",lat:41.3845,lng:2.1787,k:"see",cat:"Free sight",c:"Free",why:"A long stretch of Roman city wall with towers, right on the street.",kid:"Roman soldiers once guarded these towers.",tip:"On Via Laietana, by Jaume I metro."},
 {id:"x-call",n:"El Call (old Jewish quarter)",lat:41.3826,lng:2.1747,k:"see",cat:"Hidden gem",c:"Free",why:"The narrowest, twistiest lanes of the old town.",kid:"Can you touch both walls at once in the narrowest lane?",tip:"Between the cathedral and Plaça Sant Jaume."},
 {id:"x-montcada",n:"Carrer de Montcada",lat:41.3848,lng:2.1810,k:"see",cat:"Free sight",c:"Free",why:"Medieval street of merchant palaces with courtyards you can peek into.",kid:"Look up for stone faces on the walls.",tip:"The Picasso Museum is on this street."}],
 rain:["El Born CCM and La Boqueria are covered.","MUHBA history museum under Plaça del Rei (Roman streets underground).","Chocolate Museum (small, near El Born)."],
 facts:["Barcelona was a Roman town called Barcino 2,000 years ago.","Plaça Reial's lampposts were Gaudí's first public commission (1879).","Santa Maria del Mar was built in just 54 years. Fast for the 1300s."],

{id:"d3",dow:"Wed",date:"21 Oct",title:"Park Güell, Bunkers & Gràcia",area:"Gràcia",start:"Metro Vallcarca (L3), then outdoor escalators up",budget:"€128",budgetNote:"€49.50 Park Güell (2×€18 + child €13.50) · ~€8 transport · ~€70 food",
 lede:"Hill day with the best views in the city. Wear good shoes: steep first, then downhill.",
 stops:[
 {id:"tres",n:"Turó de les Tres Creus",lat:41.4158,lng:2.1500,k:"view",t:"9:45",c:"Free zone",why:"Hilltop with three crosses in Park Güell's free area: 360° view over the city and sea.",kid:"Climb to the top and find the Sagrada Família towers.",tip:"Get here first, before your timed slot."},
 {id:"guell",n:"Park Güell Monumental Zone",lat:41.4145,lng:2.1527,k:"see",t:"10:30 slot",c:"€18 adult · €13.50 child 7–12",why:"The mosaic salamander, the wavy bench terrace and the gingerbread gatehouses.",kid:"Count the columns in the Hypostyle Room (there are 86).",tip:"Book on parkguell.barcelona. Arrive no more than 30 min late or the ticket is void."},
 {id:"picnic3",n:"Park Güell free forest zone (picnic)",lat:41.4160,lng:2.1540,k:"eat",t:"12:30",c:"~€15 bought beforehand",why:"Shady paths and stone viaducts. No ticket needed.",kid:"Walk under the leaning stone arcades that look like waves.",tip:"Buy bocadillos and fruit at a bakery near the metro before going up."},
 {id:"bunkers",n:"Bunkers del Carmel",lat:41.4192,lng:2.1619,k:"view",t:"14:00",c:"Free",why:"Old anti-aircraft base from 1937 on top of Turó de la Rovira. The widest view in Barcelona.",kid:"Spot the sea, Montjuïc and the Sagrada Família.",tip:"Gates close late afternoon (17:30 winter / 19:30 summer). Be up by 15:00. Bus V17 or 24 if legs are tired."},
 {id:"vicens",n:"Casa Vicens",lat:41.4035,lng:2.1508,k:"see",t:"16:00",c:"Exterior free · inside paid",why:"Gaudí's first house, covered in green-and-white tiles with marigold flowers.",kid:"Find the tiny painted flowers on the tiles.",tip:"Good rainy-day interior."},
 {id:"vila",n:"Plaça de la Vila de Gràcia",lat:41.4026,lng:2.1570,k:"play",t:"16:45",c:"Free",why:"Village square with a tall clock tower. Gràcia used to be its own town.",kid:"Local kids play football and ride scooters here.",tip:"Benches for a break."},
 {id:"sol",n:"Plaça del Sol",lat:41.4012,lng:2.1576,k:"play",t:"17:15",c:"Free",why:"The liveliest square in Gràcia, full of families in the early evening.",kid:"Space to run around.",tip:"Ice cream shops nearby."},
 {id:"virreina",n:"Plaça de la Virreina",lat:41.4036,lng:2.1611,k:"see",t:"18:00",c:"Free",why:"Quiet square with a pretty church. Locals' favourite.",kid:"Listen for the church bell.",tip:"Sunset is around 18:45."},
 {id:"tapeo",n:"Tapeo Gràcia (dinner)",lat:41.4031,lng:2.1597,k:"eat",t:"evening",c:"Tapas ~€5–12 each",why:"Neighbourhood tapas: ham croquettes, bombas, cod fritters.",kid:"Patatas bravas and croquetas are kid-proof.",tip:"Carrer Topazi 8. Check opening time; book if you can."}],
 extras:[
 {id:"x-creueta",n:"Parc de la Creueta del Coll",lat:41.4185,lng:2.1470,k:"play",cat:"Kid fun",c:"Free",why:"An old stone quarry turned into a park, with a huge concrete sculpture by Chillida hanging over the pond.",kid:"A giant stone claw hangs in the air on cables.",tip:"15 min walk north of Park Güell."},
 {id:"x-putxet",n:"Jardins del Turó del Putxet",lat:41.4087,lng:2.1420,k:"view",cat:"Viewpoint",c:"Free",why:"Quiet hilltop park with a playground and a city view, mostly used by locals.",kid:"Playground at the top.",tip:"Good alternative if Park Güell's free zone is crowded."},
 {id:"x-guinardo",n:"Parc del Guinardó",lat:41.4170,lng:2.1690,k:"view",cat:"Viewpoint",c:"Free",why:"Big wooded hill park just below the Bunkers, with paths and lookouts.",kid:"Forest paths in the middle of the city.",tip:"Pairs with the Bunkers on the way down."},
 {id:"x-revolucio",n:"Plaça de la Revolució",lat:41.4027,lng:2.1588,k:"play",cat:"Hidden gem",c:"Free",why:"Long, sunny Gràcia square with a playground and ice cream shops.",kid:"Playground and ice cream in one stop.",tip:"Between Plaça del Sol and Plaça de la Virreina."}],
 rain:["Swap with Thursday (CosmoCaixa).","Casa Vicens interior (paid).","Gràcia's covered market, Mercat de l'Abaceria."],

{id:"d4",dow:"Thu",date:"22 Oct",title:"Science, Parks & a Free Museum Hour",area:"Sarrià & Ciutadella",start:"FGC L7 Av. Tibidabo, then 15 min walk (or bus V15)",budget:"€113",budgetNote:"€16 CosmoCaixa (under 16 free) · Picasso free slot · ~€12 transport · ~€85 food",
 lede:"An indoor rainforest in the morning, a giant mammoth in the afternoon, and Picasso for free on Thursday.",
 stops:[
 {id:"cosmo",n:"CosmoCaixa science museum",lat:41.4135,lng:2.1316,k:"see",t:"10:00–13:30",c:"€8 adult · under 16 free",why:"Hands-on science museum with a real flooded Amazon forest (piranhas, tropical fish, rain showers) and a giant Geological Wall.",kid:"Stay for the tropical rain that falls in the flooded forest every few hours.",tip:"Open daily 10:00–20:00. Planetarium seats are limited; book a session with your ticket. Café on site for lunch."},
 {id:"arc",n:"Arc de Triomf",lat:41.3910,lng:2.1806,k:"see",t:"14:30",c:"Free",why:"Red-brick arch built for the 1888 World Fair. Wide promenade for scooters and street music.",kid:"Race to the arch from the far end.",tip:"Metro L1 Arc de Triomf."},
 {id:"cascada",n:"Cascada fountain (Ciutadella)",lat:41.3897,lng:2.1871,k:"see",t:"15:00",c:"Free",why:"A grand fountain with golden horses. Climb the stairs behind it.",kid:"A young Gaudí helped build this as a student.",tip:"Ciutadella Park has clean grass for a rest."},
 {id:"lake",n:"Ciutadella boating lake",lat:41.3884,lng:2.1857,k:"play",t:"15:30",c:"Rowing boat small fee",why:"Rent a rowing boat for half an hour.",kid:"Let the child row. It's harder than it looks!",tip:"Boats may close early in autumn; check on the day."},
 {id:"mammoth",n:"Mammoth statue",lat:41.3874,lng:2.1886,k:"play",t:"16:00",c:"Free",why:"A life-size stone mammoth from 1907. Barcelona's favourite photo with kids.",kid:"Stand by its tusk for scale.",tip:"Barcelona Zoo is next door (paid, optional)."},
 {id:"picasso",n:"Picasso Museum (free slot)",lat:41.3852,lng:2.1810,k:"see",t:"16:30–19:00",c:"Free Thu 16:00–19:00 (book)",why:"Picasso's early work, from childhood sketches to his blue period, in five medieval palaces.",kid:"Find drawings Picasso made when he was about your age.",tip:"Free tickets need a timed booking on museupicassobcn.cat. Book now."},
 {id:"paradeta",n:"La Paradeta Born (dinner)",lat:41.3862,lng:2.1838,k:"eat",t:"evening",c:"Pay by weight, ~€15–20 pp",why:"Pick your seafood at the counter, they cook it, you collect when your number is called.",kid:"Choosing the fish is part of the fun. Fried calamari is a safe bet.",tip:"Carrer Comercial 7. Queue forms early; go at opening."}],
 extras:[
 {id:"x-umbracle",n:"Umbracle & Hivernacle (Ciutadella)",lat:41.3880,lng:2.1853,k:"see",cat:"Hidden gem",c:"Free to see from outside",why:"Two 19th-century iron-and-glass plant houses inside the park.",kid:"A shady house made of wooden slats for plants.",tip:"Near the park's Passeig de Picasso side."},
 {id:"x-zoo",n:"Barcelona Zoo",lat:41.3870,lng:2.1910,k:"play",cat:"Kid fun",c:"Paid · ~€21 adult, ~€12.50 child",why:"Big zoo inside Ciutadella Park, with a children's farm.",kid:"Elephants, gorillas and a petting farm.",tip:"Only if you skip CosmoCaixa or have a spare morning."},
 {id:"x-sjoan",n:"Passeig de Sant Joan",lat:41.3940,lng:2.1755,k:"play",cat:"Kid fun",c:"Free",why:"Wide boulevard with playgrounds every block, popular with local families.",kid:"Playground hopping up the avenue.",tip:"Watch for the bike lane in the middle."},
 {id:"x-tamarita",n:"Jardins de la Tamarita",lat:41.4122,lng:2.1340,k:"play",cat:"Hidden gem",c:"Free",why:"Small leafy garden near CosmoCaixa with a play area, quiet and local.",kid:"A calm run-around after the museum.",tip:"2 min from CosmoCaixa."}],
 rain:["CosmoCaixa is indoors; stay longer.","Picasso Museum.","Barcelona Zoo has covered houses (paid)."],
 facts:["CosmoCaixa's flooded forest has real Amazon animals under one glass roof.","Ciutadella was a military fortress before it became a park.","The mammoth statue has stood in the park since 1907."],
 spot:["A piranha","A rock layer in the Geological Wall","Golden horses on a fountain","A mammoth","A rowing boat","A Picasso drawing he made as a kid"]},

{id:"d5",dow:"Fri",date:"23 Oct",title:"Port, Barceloneta & Beach Day",area:"Barceloneta",start:"Metro Drassanes (L3)",budget:"€68",budgetNote:"No tickets · ~€8 transport · ~€60 food",
 lede:"Harbour walk, the famous bombas for lunch, then swim and play along the beaches.",
 stops:[
 {id:"colom",n:"Columbus Monument",lat:41.3758,lng:2.1778,k:"see",t:"10:00",c:"Free",why:"A 60 m column at the bottom of La Rambla.",kid:"Columbus is pointing at the Mediterranean, not at America.",tip:"Lion statues at the base are fine for photos."},
 {id:"ramblamar",n:"Rambla de Mar & Port Vell",lat:41.3762,lng:2.1810,k:"see",t:"10:20",c:"Free",why:"Wooden walkway over the harbour with yachts and sea views.",kid:"Watch the swing bridge if it opens for a boat.",tip:"The Aquarium is here if it rains."},
 {id:"bmarket",n:"Mercat de la Barceloneta",lat:41.3800,lng:2.1890,k:"see",t:"11:30",c:"Free",why:"Modern neighbourhood market in the old fishermen's district.",kid:"Spot five kinds of fish you've never seen.",tip:"Buy fruit for the beach here."},
 {id:"cova",n:"La Cova Fumada (lunch)",lat:41.3792,lng:2.1893,k:"eat",t:"12:30",c:"Under ~€14 pp",why:"Tiny tavern where the 'bomba' (meat-and-potato ball with sauce) was invented.",kid:"One bomba each. Ask for less spicy sauce.",tip:"Cash only, weekday lunch, no sign outside. Arrive before 13:00."},
 {id:"estel",n:"L'Estel Ferit (stacked cubes)",lat:41.3776,lng:2.1912,k:"see",t:"13:30",c:"Free",why:"Rebecca Horn's rusty tower of cubes on the sand, a tribute to the old beach shacks.",kid:"Count the cubes.",tip:"Good meeting point if anyone gets lost."},
 {id:"beach",n:"Barceloneta / Sant Miquel beach",lat:41.3782,lng:2.1922,k:"play",t:"14:00–16:30",c:"Free",why:"City beach with ~20 °C sea in late October.",kid:"Swim and dig. Stay where you can stand.",tip:"No lifeguards after early October. Swim near the shore and take turns watching bags."},
 {id:"peix",n:"Peix d'Or (golden fish)",lat:41.3866,lng:2.1974,k:"see",t:"17:00",c:"Free",why:"Frank Gehry's giant copper fish from the 1992 Olympics.",kid:"Does it look like it's swimming or jumping?",tip:"Promenade is flat and great for walking."},
 {id:"bogatell",n:"Bogatell beach",lat:41.3935,lng:2.2068,k:"play",t:"17:30",c:"Free",why:"Calmer family beach with a playground, ping-pong tables and outdoor gym.",kid:"Playground plus beach football.",tip:"Metro back: Llacuna (L4), 13 min walk."}],
 extras:[
 {id:"x-pbarceloneta",n:"Parc de la Barceloneta",lat:41.3832,lng:2.1945,k:"play",cat:"Kid fun",c:"Free",why:"Park around an old gasworks water tower, with a playground, next to the beach.",kid:"Playground break between swims.",tip:"Behind the beach near the hospital."},
 {id:"x-teleferic",n:"Port Cable Car (Torre de Sant Sebastià)",lat:41.3717,lng:2.1885,k:"view",cat:"Viewpoint",c:"Paid · ~€12.50 one way",why:"Old cable car crossing the harbour from Barceloneta to Montjuïc, 70 m above the water.",kid:"Fly over the ships in a hanging cabin.",tip:"Splurge option. One way gets you to Montjuïc for Saturday-style views."},
 {id:"x-wtower",n:"Barceloneta breakwater (Rompeolas)",lat:41.3695,lng:2.1902,k:"view",cat:"Viewpoint",c:"Free",why:"Walk out along the sea wall at the tip of Barceloneta for open-sea views.",kid:"Waves splash against the big rocks.",tip:"Stay away from the edge on windy days."},
 {id:"x-poblenou",n:"Rambla del Poblenou",lat:41.4005,lng:2.2025,k:"see",cat:"Hidden gem",c:"Free",why:"The locals' rambla: calm, tree-lined, with cafés and ice cream, a short walk inland from Bogatell.",kid:"Ice cream reward after the beach.",tip:"Metro Poblenou (L4) at the top end."}],
 rain:["Barcelona Aquarium (paid: ~€27–29 adult, ~€22 child 5–10; penguins and touch pools).","Maritime Museum at Drassanes.","Swap with Saturday afternoon: MNAC is free from 15:00 on Saturdays."],

 stops:[
 {id:"funic",n:"Funicular de Montjuïc",lat:41.3727,lng:2.1690,k:"see",t:"10:00",c:"Normal metro fare (T-casual)",why:"Underground funicular from Paral·lel metro up the hill.",kid:"It climbs like a train on a steep ramp.",tip:"From the top take bus 150 to the castle (T-casual). The cable car is the fun paid option: €17.10 adult / €11.70 child online."},
 {id:"castle",n:"Montjuïc Castle",lat:41.3634,lng:2.1663,k:"view",t:"10:45",c:"Outside free · inside €12 adult (under 8 free)",why:"Star-shaped fortress on top of the hill with views over the port and sea.",kid:"Walk around the moat and find the cannons.",tip:"Open 10:00–20:00 until 31 Oct. The walls and views outside are free."},

 {id:"brossa",n:"Jardins de Joan Brossa",lat:41.3693,lng:2.1667,k:"play",t:"12:30",c:"Free",why:"Old amusement-park grounds turned garden with play features.",kid:"Playground and space to roam. Good picnic stop.",tip:"Picnic lunch here; bring food from below."},
 {id:"anella",n:"Anella Olímpica",lat:41.3647,lng:2.1531,k:"see",t:"14:00",c:"Free",why:"The 1992 Olympic park with the white Calatrava tower.",kid:"Peek into the Olympic stadium gates.",tip:"Long, flat avenue. Toilets near the stadium."},
 {id:"mnac",n:"MNAC terrace & steps",lat:41.3685,lng:2.1533,k:"view",t:"15:30",c:"Outside free · museum free Sat from 15:00",why:"Palace on the hill. The steps give the best view down to Plaça d'Espanya.",kid:"Count the steps down to the fountain.",tip:"Museum is free on Saturday afternoons. Great rain backup."},
 {id:"blai",n:"Carrer de Blai (pintxos dinner)",lat:41.3735,lng:2.1630,k:"eat",t:"18:30",c:"Pintxos ~€1.50–3 each",why:"Pedestrian street of pintxo bars in Poble Sec. Locals' cheap night out.",kid:"Pick what looks good off the counter. Keep the sticks to pay.",tip:"Go early; it fills up after 20:00."},

 {id:"x-laribal",n:"Jardins de Laribal & Font del Gat",lat:41.3700,lng:2.1580,k:"see",cat:"Hidden gem",c:"Free",why:"Terraced gardens with stairways, water channels and Moorish-style fountains.",kid:"Follow the little water channel down the steps.",tip:"On the way between the Anella and Poble Sec."},

function kmd(a,b){var r=Math.PI/180,dl=(b.lat-a.lat)*r,dn=(b.lng-a.lng)*r;var x=Math.sin(dl/2)*Math.sin(dl/2)+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dn/2)*Math.sin(dn/2);return 12742*Math.asin(Math.sqrt(x))}
function walkKm(a,b){return kmd(a,b)*1.3}
function minsOf(k){return Math.max(1,Math.round(k/4.3*60))}
function fmtKm(k){return k<1?Math.round(k*100)*10+' m':fmt(k.toFixed(1))+' km'}
function mapsUrl(n){return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(n.replace(/\s*\(.*?\)/g,'')+', Barcelona')}
function dayKm(d){var t=0;for(var i=1;i<d.stops.length;i++){if(!TRANSIT[d.id+':'+d.stops[i].id])t+=walkKm(d.stops[i-1],d.stops[i])}return t}
function stadtMap(d,sel){var pts=d.stops.concat(S.stadt.showX?d.extras:[]);var la=pts.map(function(p){return p.lat}),lo=pts.map(function(p){return p.lng});
 var minLa=Math.min.apply(0,la),maxLa=Math.max.apply(0,la),minLo=Math.min.apply(0,lo),maxLo=Math.max.apply(0,lo);var k=Math.cos(41.39*Math.PI/180);var W=640,H=360,pad=34;
 var sx=(W-2*pad)/Math.max(.002,(maxLo-minLo)*k),sy=(H-2*pad)/Math.max(.002,(maxLa-minLa));var sc=Math.min(sx,sy);
 var ox=(W-(maxLo-minLo)*k*sc)/2,oy=(H-(maxLa-minLa)*sc)/2;
 function X(p){return ox+(p.lng-minLo)*k*sc}function Y(p){return oy+(maxLa-p.lat)*sc}
 var line=d.stops.map(function(p){return X(p).toFixed(1)+','+Y(p).toFixed(1)}).join(' ');
 var dots=d.stops.map(function(p,i){var on=p.id===sel,dn=S.stadt.done[p.id];return '<g data-act="stadtSel" data-a="'+p.id+'" style="cursor:pointer"><circle cx="'+X(p).toFixed(1)+'" cy="'+Y(p).toFixed(1)+'" r="'+(on?19:15)+'" fill="'+(dn?'#49C5B6':on?'#FF6A52':'#13324A')+'" stroke="#fff" stroke-width="3"/><text x="'+X(p).toFixed(1)+'" y="'+(Y(p)+5).toFixed(1)+'" text-anchor="middle" font-size="14" font-weight="800" fill="'+(dn?'#13324A':'#fff')+'">'+(i+1)+'</text></g>'}).join('');
 var ex=S.stadt.showX?d.extras.map(function(p){return '<g data-act="stadtSel" data-a="'+p.id+'" style="cursor:pointer"><circle cx="'+X(p).toFixed(1)+'" cy="'+Y(p).toFixed(1)+'" r="9" fill="#ECD06F" stroke="#13324A" stroke-width="2"/></g>'}).join(''):'';
 return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;border-radius:20px;background:linear-gradient(180deg,#EAF3F3,#F7F1DF)"><polyline points="'+line+'" fill="none" stroke="#2779A7" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 9"/>'+ex+dots+'</svg>'}
ROUTES.stadt=function(a){var di=Math.min(CITY.length-1,Math.max(0,S.stadt.day)),d=CITY[di],sel=S.stadt.sel||null;var P={};d.stops.concat(d.extras).forEach(function(s){P[s.id]=s});

 var list=d.stops.map(function(s,i){var tr=TRANSIT[d.id+':'+s.id],leg=i>0?'<div class="leg">'+(tr?esc(tr):'Zu Fuß '+minsOf(walkKm(d.stops[i-1],s))+' Min. · '+fmtKm(walkKm(d.stops[i-1],s)))+'</div>':'';
  var dn=S.stadt.done[s.id],open=sel===s.id;

 var extras=S.stadt.showX?'<div class="card" style="margin-top:12px"><div class="mono">Wenn noch Zeit ist</div>'+d.extras.map(function(s){return '<div class="stop"><span class="no" style="background:#ECD06F;color:#13324A">+</span><div><b>'+esc(s.n)+'</b> <span class="tag">'+esc(s.cat)+'</span>'+stopDetail(s)+'</div></div>'}).join('')+'</div>':'';
 var spot=d.spot.map(function(s,i){var k=d.id+'-'+i,on=S.wes.spot[k];return '<button class="item'+(on?' done':'')+'" data-act="spotTick" data-a="'+k+'"><span class="bx">'+(on?'✓':'')+'</span><span class="tx">'+esc(s)+'</span></button>'}).join('');
 var tips=STADT_TIPS.map(function(t){return '<details class="acc"'+(t[2]?' open':'')+'><summary>'+t[0]+'</summary><div class="c">'+t[1]+'</div></details>'}).join('');
 return topbar('STADTPLAN · '+esc(S.trip.name).toUpperCase(),'Unsere Route','/','<button class="chip'+(S.stadt.showX?' on':'')+'" data-act="stadtX">Mehr entdecken</button>')+
 '<div class="chips" style="margin-bottom:14px">'+days+'</div>'+
 '<div class="grid2" style="align-items:start"><div class="col"><div class="dark"><span class="tab">TAG '+(di+1)+' · '+d.area.toUpperCase()+'</span><h2 class="disp" style="font-size:36px">'+esc(d.title)+'</h2><p style="margin:8px 0">'+esc(d.lede)+'</p><div class="wrap"><span class="tag">'+dayKm(d).toFixed(1).replace('.',',')+' km zu Fuß</span><span class="tag">'+d.stops.length+' Stopps</span><span class="tag">'+esc(d.budget)+'</span><span class="tag" style="background:#ECD06F">Beste Wochentage: '+d.dow+'</span></div><p class="muted" style="color:#CFE0EA;font-size:13px;margin-top:8px">Start: '+esc(d.start)+'. '+esc(d.budgetNote)+'</p></div>'+
 stadtMap(d,sel)+

 '<div class="col"><div class="card"><div class="row"><b>Heute besucht</b><div class="sp"></div><span class="mono">'+done+' von '+d.stops.length+'</span></div><div class="bar" style="margin:8px 0"><i style="width:'+(done/d.stops.length*100)+'%"></i></div>'+list+'</div>'+extras+'</div></div>'+
 '<h2 class="disp" style="font-size:34px;margin:26px 0 12px">Vor der Reise</h2><div class="col">'+tips+'</div><p class="muted" style="margin-top:12px;font-size:13px">Preise und Zeiten Oktober 2026. Nur auf offiziellen Seiten buchen. Karte und Texte funktionieren ohne Internet, die Google-Maps-Links brauchen WLAN.</p>'};

 if(!S.pin){if(pinStep===0){pinTmp=buf;pinStep=1;rerender();return}
