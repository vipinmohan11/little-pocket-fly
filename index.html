<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kofferforscher</title><meta name="theme-color" content="#13324A"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<style>@font-face{font-family:'Big Shoulders Display';font-weight:800;src:url(fonts/big-shoulders-display-latin-800-normal.woff2) format('woff2');font-display:swap}
@font-face{font-family:'Big Shoulders Display';font-weight:900;src:url(fonts/big-shoulders-display-latin-900-normal.woff2) format('woff2');font-display:swap}
@font-face{font-family:'Figtree';font-weight:500;src:url(fonts/figtree-latin-500-normal.woff2) format('woff2');font-display:swap}
@font-face{font-family:'Figtree';font-weight:700;src:url(fonts/figtree-latin-700-normal.woff2) format('woff2');font-display:swap}
@font-face{font-family:'Figtree';font-weight:800;src:url(fonts/figtree-latin-800-normal.woff2) format('woff2');font-display:swap}
@font-face{font-family:'DM Mono';font-weight:500;src:url(fonts/dm-mono-latin-500-normal.woff2) format('woff2');font-display:swap}
@font-face{font-family:'Caveat';font-weight:700;src:url(fonts/caveat-latin-700-normal.woff2) format('woff2');font-display:swap}
:root{--ink:#13324A;--ink2:#55677A;--ink3:#8796A3;--deep:#13324A;--ocean:#2779A7;--lagoon:#49C5B6;--sand:#ECD06F;--sky:#B5D5FF;--mint:#B1EAC4;--peach:#FFB288;--coral:#FF6A52;--cream:#F5F0E6;--paper:#FFFDF8;--line:rgba(19,50,74,.13);--soft:rgba(19,50,74,.06);--ts:1}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:'Figtree',system-ui,sans-serif;color:var(--ink);background:radial-gradient(60% 70% at 0% 0%,rgba(73,197,182,.22),transparent 60%),radial-gradient(55% 70% at 100% 100%,rgba(236,208,111,.28),transparent 60%),var(--cream);background-attachment:fixed;overflow-x:hidden;font-size:calc(16px*var(--ts));line-height:1.4;-webkit-user-select:none;user-select:none}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;touch-action:manipulation;font-size:inherit}
input,textarea{font-family:inherit;color:var(--ink);-webkit-user-select:text;user-select:text}
a{color:inherit;text-decoration:none}
h1,h2,h3,p{margin:0}
svg{display:block}
.mono,.lab{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2);font-weight:500}
.disp{font-family:'Big Shoulders Display',sans-serif;font-weight:900;line-height:.95;text-transform:uppercase}
.hand{font-family:'Caveat',cursive;font-weight:700}
.muted{color:var(--ink2)}
.sp{flex:1}
.row{display:flex;align-items:center;gap:10px}
.col{display:flex;flex-direction:column;gap:10px}
.wrap{display:flex;flex-wrap:wrap;gap:8px}
.hide{display:none!important}
#app{max-width:1400px;margin:0 auto;padding:0 18px;position:relative}
.view{animation:vin .3s ease both}
@keyframes vin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@keyframes draw{from{stroke-dashoffset:30}to{stroke-dashoffset:0}}
@keyframes dash{to{stroke-dashoffset:-64}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
/* screen frame */
.scr{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.scr>.bd{flex:1;min-height:0;padding-bottom:14px}
.hd{display:flex;align-items:center;gap:12px;height:68px;flex:none}
.hd h1{font-size:34px}
.hd .t{display:flex;flex-direction:column;gap:3px}
.back{width:46px;height:46px;border-radius:50%;border:1.5px solid var(--line);background:var(--paper);display:grid;place-items:center;flex:none}
.back svg{width:20px;height:20px}
/* buttons */
.b{height:44px;border-radius:22px;padding:0 18px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:800;font-size:15px;background:var(--paper);border:1.5px solid var(--line);white-space:nowrap;transition:transform .12s,background .2s}
.b:active,.tl:active,.chip:active{transform:scale(.96)}
.b.p{background:var(--deep);color:#fff;border-color:var(--deep)}
.b.y{background:var(--sand);border-color:var(--sand)}
.b.t{background:var(--lagoon);border-color:var(--lagoon)}
.b.c{background:var(--coral);border-color:var(--coral);color:#fff}
.b.s{height:36px;padding:0 14px;font-size:13px}
.b[disabled]{opacity:.4;pointer-events:none}
.ib{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--line);background:var(--paper);display:grid;place-items:center;font-weight:800;font-size:18px;flex:none}
.seg{display:inline-flex;background:var(--soft);border-radius:24px;padding:4px;gap:2px;flex:none}
.seg>*{height:36px;padding:0 16px;border-radius:18px;display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;white-space:nowrap;color:var(--ink2)}
.seg>.on{background:var(--deep);color:#fff}
.chip{height:36px;border-radius:18px;padding:0 14px;display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:14px;border:1.5px solid var(--line);background:var(--paper);white-space:nowrap}
.chip.on{background:var(--deep);color:#fff;border-color:var(--deep)}
.tag{display:inline-flex;align-items:center;height:22px;font-family:'DM Mono',monospace;font-size:10.5px;letter-spacing:.08em;padding:0 8px;border-radius:11px;background:var(--soft);text-transform:uppercase;white-space:nowrap}
/* surfaces */
.pn{background:var(--paper);border-radius:22px;border:1.5px solid var(--line)}
.pad{padding:16px 18px}
.dark{background:linear-gradient(155deg,#16405E,#13324A 60%,#0F2A3F);color:#fff;border-radius:22px;position:relative}
.dark .lab{color:var(--mint)}
.ftab{position:absolute;left:20px;top:-13px;background:var(--sand);color:var(--ink);font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.14em;padding:4px 12px;border-radius:10px 10px 0 0}
.bar{height:8px;border-radius:4px;background:var(--soft);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--lagoon);border-radius:4px;transition:width .5s cubic-bezier(.3,1.3,.5,1)}
.scroll{overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.scroll::-webkit-scrollbar{width:6px;height:6px}.scroll::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
/* tiles */
.tl{border-radius:18px;padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:2px;border:1.5px solid var(--line);background:var(--paper);transition:transform .12s,background .2s,border-color .2s;position:relative}
.tl.on{border-color:var(--deep);background:var(--deep);color:#fff}
.tl.on .lab,.tl.on .muted{color:#CFE0EA}
/* checks */
.ck{display:flex;align-items:center;gap:10px;min-height:42px;padding:4px 6px;border-radius:12px;width:100%;text-align:left;transition:background .2s}
.ck:active{background:var(--soft)}
.ck .bx{width:26px;height:26px;border-radius:8px;border:2px solid var(--ink);flex:none;display:grid;place-items:center;background:#fff;transition:background .2s,border-color .2s}
.ck .bx svg{width:18px;height:18px;stroke-dasharray:30;stroke-dashoffset:30}
.ck.on .bx{background:var(--lagoon);border-color:var(--lagoon)}
.ck.on .bx svg{animation:draw .3s ease forwards}
.ck .tx{flex:1;font-weight:700;font-size:15px;line-height:1.2}
.ck .tx small{display:block;font-weight:500;font-size:12px;color:var(--ink2)}
.ck.on .tx{color:var(--ink3);text-decoration:line-through;text-decoration-thickness:2px}
/* toasts */
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--deep);color:#fff;border-radius:20px;padding:10px 20px;font-weight:700;z-index:80;animation:vin .25s;max-width:90vw}
.stampt{position:fixed;right:18px;bottom:18px;z-index:85;display:flex;align-items:center;gap:12px;background:var(--paper);border:1.5px solid var(--line);border-radius:18px;padding:10px 16px 10px 10px;animation:stin 3.4s ease forwards;max-width:360px}
.stampt .sm{width:52px;height:52px;flex:none;animation:pop .5s .15s both}
@keyframes stin{0%{transform:translateY(120%);opacity:0}10%{transform:none;opacity:1}88%{transform:none;opacity:1}100%{transform:translateY(120%);opacity:0}}
.sheet{position:fixed;inset:0;background:rgba(19,50,74,.5);z-index:60;display:grid;place-items:center;padding:20px;animation:vin .2s}
.sheet>div{background:var(--paper);border-radius:24px;max-width:560px;width:100%;max-height:88vh;overflow:auto;padding:22px}
/* home windows */
.windows{display:grid;grid-template-columns:repeat(7,1fr);gap:clamp(8px,1.4vw,18px);padding:4px 0}
@media (max-width:820px){.windows{grid-template-columns:repeat(4,1fr)}}
.win{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;transition:transform .2s}
.win:active{transform:scale(.97)}
.bezel,.glass,.shade{display:block}
.bezel{position:relative;width:100%;aspect-ratio:.74;border-radius:46% / 33%;background:linear-gradient(160deg,#fff 0%,#E9ECEE 45%,#CBD1D5 100%);box-shadow:0 18px 24px -18px rgba(19,50,74,.6),inset 0 2px 2px #fff,inset 0 -6px 10px rgba(0,0,0,.12);padding:7%;transition:transform .9s cubic-bezier(.6,0,.2,1)}
.bezel::before{content:'';position:absolute;inset:3.5%;border-radius:inherit;border:2px solid rgba(255,255,255,.9);box-shadow:inset 0 0 0 2px rgba(0,0,0,.06)}
.glass{position:relative;width:100%;height:100%;border-radius:44% / 31%;overflow:hidden;box-shadow:inset 0 0 0 5px #7C8890,inset 0 10px 18px rgba(0,0,0,.35);background-image:url(assets/pano.svg);background-repeat:no-repeat;background-size:auto 330%;background-position:calc(var(--i)*16.66%) 41%}
.glass::after{content:'';position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,.28),transparent 35%);pointer-events:none}
.shade{position:absolute;left:0;right:0;top:0;height:var(--sh,30%);background:repeating-linear-gradient(180deg,#F4F5F5 0 9px,#DDE1E3 9px 11px);border-bottom:5px solid #B8BEC2;border-radius:0 0 8px 8px;transition:height .8s cubic-bezier(.5,0,.2,1);z-index:2}
.shade::after{content:'';position:absolute;left:50%;bottom:-14px;width:34px;height:10px;margin-left:-17px;border-radius:5px;background:#9AA3A8}
.win .ic{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;position:absolute;left:50%;bottom:13%;transform:translateX(-50%);z-index:3;border:2px solid #fff}
.win .ic svg{width:17px;height:17px}
.win .lb{font-weight:800;font-size:clamp(12px,1.3vw,15px);line-height:1.15}
.win .st{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.06em;color:var(--ink2);text-transform:uppercase}
.win .nw{position:absolute;right:4%;top:4%;z-index:4;background:var(--coral);color:#fff;font-family:'DM Mono',monospace;font-size:10px;padding:2px 7px;border-radius:9px}
.zoomer{position:fixed;inset:0;z-index:90;opacity:0;pointer-events:none;transition:opacity .35s}
.zoomer.on{opacity:1}
/* stamps */
.stamp{width:100%;aspect-ratio:1;display:block}
.stg{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
.sti{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;font-size:12px;font-weight:700;line-height:1.15}
.sti.lock{opacity:.4;filter:grayscale(1)}
/* boarding pass */
.bp{display:flex;border-radius:16px;overflow:hidden;background:var(--paper);border:1.5px solid var(--line);min-height:96px;position:relative}
.bp .m{flex:1;padding:10px 14px;display:flex;flex-direction:column;gap:4px}
.bp .s{width:84px;border-left:2px dashed var(--line);padding:10px;display:flex;flex-direction:column;justify-content:space-between;align-items:center}
.bp .cd{font-family:'Big Shoulders Display';font-weight:900;font-size:30px;line-height:1}
/* inputs */
.inp{height:46px;border-radius:14px;border:1.5px solid var(--line);padding:0 14px;font-size:16px;background:#fff;width:100%}
.pin{display:grid;grid-template-columns:repeat(3,72px);gap:10px;justify-content:center}
.pin button{height:62px;border-radius:20px;border:1.5px solid var(--line);background:var(--paper);font-size:24px;font-weight:800}
.dots{display:flex;gap:12px;justify-content:center;margin:14px 0}
.dots i{width:16px;height:16px;border-radius:50%;border:2.5px solid var(--ink)}
.dots i.f{background:var(--ink)}
.tgl{width:58px;height:32px;border-radius:16px;background:#C9CDD1;position:relative;transition:background .2s;flex:none}
.tgl::after{content:'';position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .2s}
.tgl.on{background:#2BA594}.tgl.on::after{left:30px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:4px;background:var(--soft)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:var(--deep);margin-top:-10px;border:4px solid var(--paper)}
input[type=range]::-moz-range-track{height:8px;border-radius:4px;background:var(--soft)}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--deep);border:4px solid var(--paper)}
/* quiz */
.qo{display:block;width:100%;text-align:left;padding:11px 14px;border-radius:14px;border:1.5px solid var(--line);background:#fff;font-weight:700;font-size:15px;margin:6px 0;transition:background .2s}
.qo.ok{background:var(--mint);border-color:#7FD39E}
.qo.no{background:#FFF1CC;border-color:#ECD06F}
.qo.dim{opacity:.5}
.okmsg{font-size:14px;margin-top:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{.hd .b,.seg,.back{display:none!important}body{background:#fff}.scr{height:auto;overflow:visible}}
.scr.free{height:auto;min-height:100vh;min-height:100dvh;overflow:visible}

 {id:"pgaudi",n:"Plaça de Gaudí",lat:41.4049,lng:2.1763,k:"play",t:"11:00",c:"Free",why:"The pond gives the classic reflection photo of the Nativity towers. Small playground.",kid:"Take the 'upside-down Sagrada' photo in the water.",tip:"Best light in the morning."},
 {id:"avgaudi",n:"Avinguda de Gaudí",lat:41.4082,lng:2.1755,k:"see",t:"11:30",c:"Free",why:"Car-free avenue linking Sagrada Família and Sant Pau, lined with modernist lampposts.",kid:"Look back halfway: both buildings line up at each end.",tip:"Café terraces here are pricey; buy snacks at a bakery on a side street."},
 {id:"santpau",n:"Sant Pau Recinte Modernista",lat:41.4114,lng:2.1744,k:"see",t:"12:00",c:"Exterior free · inside ~€17",why:"A hospital built like a fairy-tale town with tiled domes by Domènech i Montaner.",kid:"Count the colours on the tiled roofs.",tip:"The street view is good enough if you're saving money."},
 {id:"honest",n:"Honest Greens (lunch)",lat:41.3940,lng:2.1630,k:"eat",t:"13:30",c:"~€10 bowl",why:"Counter-service grain-and-protein bowls near Passeig de Gràcia. Quick and filling.",kid:"Simple plates with chicken, rice or potatoes.",tip:"Several branches in Eixample; tap Maps for the nearest one."},
 {id:"milla",n:"Casa Milà (La Pedrera)",lat:41.3953,lng:2.1619,k:"see",t:"14:30",c:"Exterior free · inside from ~€25",why:"Gaudí's wavy stone apartment block. No straight walls on the façade.",kid:"The rooftop chimneys look like knights' helmets. Spot them from the street corner.",tip:"Price changes by demand; outside views are free."},
 {id:"batllo",n:"Casa Batlló",lat:41.3917,lng:2.1650,k:"see",t:"15:15",c:"Exterior free · inside from ~€25",why:"The 'house of bones': balconies like masks and a roof shaped like a dragon's back.",kid:"Find the dragon's spine on the roof and the knight's lance (the cross tower).",tip:"Inside visit is kid-friendly but optional on a budget day."},

 extras:[

 {id:"x-aigues",n:"Jardins de la Torre de les Aigües",lat:41.3933,lng:2.1680,k:"play",cat:"Hidden gem",c:"Free",why:"A hidden courtyard garden inside an Eixample block, with an old water tower. Enter through a doorway on Carrer de Roger de Llúria 56.",kid:"A secret garden behind a normal-looking door.",tip:"Opening hours vary out of summer; peek in when passing."},

{id:"d2",dow:"Tue",date:"20 Oct",title:"Old Town: Gothic Quarter & El Born",area:"Old Town",start:"Metro Catalunya (L1, L3)",budget:"€70",budgetNote:"No tickets · ~€5 transport · ~€65 food (sandwiches, churros, pizza)",
 lede:"Medieval lanes, Roman columns and a market. All free. Tuesday is when every site here is open.",
 stops:[

 {id:"boq",n:"La Boqueria market",lat:41.3818,lng:2.1716,k:"eat",t:"10:20",c:"Fruit cups & juice ~€2–4",why:"Covered market with fruit pyramids, jamón and sweets.",kid:"Pick a fresh juice colour each.",tip:"Stalls deeper inside are cheaper than at the entrance. Open Mon–Sat."},
 {id:"reial",n:"Plaça Reial",lat:41.3801,lng:2.1754,k:"see",t:"11:00",c:"Free",why:"Palm-tree square with arcades.",kid:"The lampposts were Gaudí's very first job for the city.",tip:"Toilets: use a café you buy something in."},

 {id:"smm",n:"Santa Maria del Mar",lat:41.3838,lng:2.1820,k:"see",t:"14:30",c:"Exterior free · inside small fee",why:"The 'cathedral of the sea', built by port workers who carried the stones.",kid:"Look for the carved porters with stones on their backs on the doors.",tip:"Sit on the steps for a break."},

 extras:[

 {id:"x-caterina",n:"Mercat de Santa Caterina",lat:41.3863,lng:2.1786,k:"see",cat:"Hidden gem",c:"Free",why:"Market with a wavy roof of over 300,000 tiles in fruit-and-vegetable colours.",kid:"From the side street, the roof looks like a wave of fruit.",tip:"Calmer and cheaper than La Boqueria."},

 {id:"x-montcada",n:"Carrer de Montcada",lat:41.3848,lng:2.1810,k:"see",cat:"Free sight",c:"Free",why:"Medieval street of merchant palaces with courtyards you can peek into.",kid:"Look up for stone faces on the walls.",tip:"The Picasso Museum is on this street."}],
 rain:["El Born CCM and La Boqueria are covered.","MUHBA history museum under Plaça del Rei (Roman streets underground).","Chocolate Museum (small, near El Born)."],
 facts:["Barcelona was a Roman town called Barcino 2,000 years ago.","Plaça Reial's lampposts were Gaudí's first public commission (1879).","Santa Maria del Mar was built in just 54 years. Fast for the 1300s."],

 extras:[

function migrate(){
 if((S.v||1)<2){ // old diary {date:{mood,best[],text,w}} -> separate memory entries

var $=function(s,r){return(r||document).querySelector(s)};
var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
function esc(t){return String(t==null?'':t).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function iso(d){return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
function today(){return iso(new Date())}
function daysBetween(a,b){return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/864e5)}
function toast(t){$$('.toast').forEach(function(x){x.remove()});var e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(function(){e.remove()},2200)}
function rnd(seed){var s=seed>>>0;return function(){s=(s*1664525+1013904223)>>>0;return s/4294967296}}
function shuffle(r,a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(r()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function fmt(n){return String(n).replace('.',',')}
function num(n){var s=Math.abs(n)>=10000?Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,'.'):String(Math.round(n*100)/100);return s.replace(/\.(\d+)$/,',$1')}

var RANKS=[[0,'Passagier'],[4,'Entdecker'],[10,'Navigator'],[18,'Co-Pilot'],[28,'Kapitän'],[40,'Flug-Legende']];

function stampProg(st){var v=0;try{v=st.n()}catch(e){}return Math.min(st.of,v)}
function checkRewards(silent){var neu=[];STAMPS.forEach(function(st){if(S.earned[st.id])return;if(stampProg(st)>=st.of){S.earned[st.id]=today();neu.push(st)}});
 if(neu.length){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}if(!silent)neu.forEach(function(st,i){setTimeout(function(){stampToast(st)},i*3600)})}}
function stampSvg(st,on){var c=on?st.c:'#B8BEC2';return '<svg class="stamp" viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="'+(on?c+'33':'none')+'" stroke="'+c+'" stroke-width="3"/><circle cx="50" cy="50" r="38" fill="none" stroke="'+c+'" stroke-width="1.6" stroke-dasharray="3 3"/><g transform="translate(32 30) scale(1.5)" fill="none" stroke="'+(on?'#13324A':'#9AA3A8')+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="'+st.ic+'"/></g></svg>'}

  reg.addEventListener('updatefound',function(){var w=reg.installing;if(!w)return;w.addEventListener('statechange',function(){if(w.state==='installed'&&navigator.serviceWorker.controller){UPD.waiting=w;var b=$('#updstate');if(b)b.innerHTML=updHtml('ready')}})})}).catch(function(){});

  var p=SWREG?SWREG.update().catch(function(){}):Promise.resolve();
  return p.then(function(){return new Promise(function(res){setTimeout(res,1200)})}).then(function(){
   if(info.version!==APP_VERSION||UPD.waiting||(SWREG&&SWREG.waiting)){UPD.waiting=UPD.waiting||(SWREG&&SWREG.waiting);UPD.info=info;box.innerHTML=updHtml('ready',info)}

 mkStamp('h-fold','hgr','Faltmeister','Beide Modelle Schritt für Schritt gefaltet',IC.book,Y,function(){return(S.hgr.fold.pfeil?1:0)+(S.hgr.fold.gleiter?1:0)},2);
 mkStamp('h-both','hgr','Zwei Modelle','Beide Modelle getestet',IC.plane,K,function(){return Object.keys(S.hgr.models||{}).length},2);
 mkStamp('h-test','hgr','Testpilot','15 Testflüge',IC.gear,B,function(){return S.hgr.log.length},15);
 mkStamp('h-20','hgr','20-Meter-Club','Ein Flug über 20 Meter',IC.trophy,C,function(){return S.hgr.best>=20?1:0},1);
 mkStamp('h-loop','hgr','Looping!','Einen Überschlag geflogen',IC.star,P,function(){return S.hgr.looped?1:0},1);
 /* Wie fliegt das? */
 WISSEN.forEach(function(w){mkStamp('wis-'+w.id,'wie',w.t,'8 Aufgaben im Kapitel gemeistert',IC.bulb,w.c,function(){return chMastery(w).n},Math.min(8,w.qs.length))});
 mkStamp('wis-all','wie','Flug-Professor','Alle 8 Kapitel gemeistert',IC.trophy,C,function(){return WISSEN.filter(function(w){return chMastery(w).n>=Math.min(8,w.qs.length)}).length},8);
 /* Wunderwesen */
 WCATS.forEach(function(c){mkStamp('wcat-'+c[0],'wes',c[1],'Alle '+c[1]+' entdeckt',c[3],c[2],function(){return WESEN.filter(function(w){return w.c===c[0]&&S.wes.found[w.id]}).length},WESEN.filter(function(w){return w.c===c[0]}).length)});
 mkStamp('w-10','wes','Spürnase','10 Wesen entdeckt',IC.eye,T,function(){return Object.keys(S.wes.found).length},10);
 mkStamp('w-know','wes','Forscher','15 Wesen erforscht',IC.bulb,Y,function(){return Object.keys(S.wes.known).length},15);
 mkStamp('w-30','wes','Stadt-Entdecker','30 Wesen entdeckt',IC.map,C,function(){return Object.keys(S.wes.found).length},30);
 /* Rekorde */
 mkStamp('r-read','rek','Rekord-Kenner','20 echte Rekorde gelesen',IC.book,T,function(){return Object.keys(S.rek.seen||{}).length},20);
 mkStamp('r-all','rek','Rekord-Lexikon','Alle echten Rekorde gelesen',IC.trophy,Y,function(){return Object.keys(S.rek.seen||{}).length},function(){return RECS.length});
 mkStamp('r-cats','rek','Rekordjäger','Alle 4 Rekord-Arten erkundet',IC.trophy,P,function(){return Object.keys(S.rek.cats||{}).length},4);
 mkStamp('r-10','rek','Schätz-Profi','10 Duelle richtig geschätzt',IC.star,Y,function(){return S.rek.right},10);
 mkStamp('r-streak','rek','Volltreffer-Serie','5 richtige Schätzungen am Stück',IC.check,C,function(){return S.rek.best},5);
 /* Tagebuch: one stamp per trip day */
 for(var i=0;i<6;i++)(function(i){mkStamp('tag-d'+i,'tag','Tag '+(i+1)+' erlebt','3 Erinnerungen an Tag '+(i+1),IC.heart,['#ECD06F','#49C5B6','#FF6A52','#B5D5FF','#B1EAC4','#FFB288'][i],function(){var d=tripDates()[i];return d?memsOn(d).length:0},3)})(i);
 mkStamp('tag-10','tag','Geschichtenerzähler','10 Erinnerungen mit eigenem Satz',IC.book,B,function(){return S.mem.filter(function(m){return m.note}).length},10);
 /* Stadtplan: one stamp per city day */
 CITY.forEach(function(d,i){mkStamp('stadt-'+d.id,'stadt','Tag '+(i+1)+' erkundet',d.title,IC.walk,['#ECD06F','#49C5B6','#FF6A52','#B5D5FF','#B1EAC4','#FFB288'][i%6],function(){return d.stops.filter(function(s){return S.stadt.done[s.id]}).length},Math.ceil(d.stops.length*0.6))});
 mkStamp('stadt-such','stadt','Such-Profi','3 Such-Listen ganz gefunden',IC.eye,T,function(){return CITY.filter(function(d){return d.spot.every(function(_,k){return S.wes.spot[d.id+'-'+k]})}).length},3);
})();

</script></body></html>
